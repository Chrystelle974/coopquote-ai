<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopQuote AI - Moteur LLM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex flex-col items-center justify-center">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-lg font-bold text-indigo-400">CoopQuote AI <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full ml-2">Claude API Connected</span></h1>
                <p class="text-xs text-slate-400">Génération de devis B2B assistée par LLM</p>
            </div>
            <span id="api-status" class="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">En attente</span>
        </div>

        <!-- Formulaire de saisie du besoin -->
        <div class="space-y-3">
            <label class="block text-xs font-semibold text-slate-300">Besoin client (Langage Naturel) :</label>
            <textarea id="user-prompt" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition" placeholder="Ex: Équipement de 15 postes de travail fixes avec moniteurs pour une nouvelle équipe..."></textarea>
            
            <button id="generate-btn" onclick="callClaudeAPI()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                <span>⚡ Générer la proposition commerciale avec l'IA</span>
            </button>
        </div>

        <!-- Zone d'affichage du résultat structuré JSON / UI -->
        <div id="output-container" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between text-xs border-b border-slate-800 pb-2">
                <span class="font-semibold text-slate-300">Résultat structuré par le System Prompt :</span>
                <span class="text-emerald-400 font-mono text-[11px]">Règles RM-01 & RM-02 appliquées</span>
            </div>
            <pre id="json-output" class="text-[11px] font-mono text-emerald-300 overflow-x-auto bg-slate-900/50 p-3 rounded-lg border border-slate-800/80"></pre>
        </div>
    </div>

    <script>
        async function callClaudeAPI() {
            const promptInput = document.getElementById('user-prompt').value;
            const statusBadge = document.getElementById('api-status');
            const btn = document.getElementById('generate-btn');
            const outputContainer = document.getElementById('output-container');
            const jsonOutput = document.getElementById('json-output');

            if (!promptInput.trim()) {
                alert("Veuillez saisir une description du besoin client.");
                return;
            }

            // 1. UI Loading State (État de chargement)
            statusBadge.innerText = "Appel API Anthropic en cours...";
            statusBadge.className = "text-[10px] bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full animate-pulse border border-amber-500/30";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            // 2. SYSTEM PROMPT MÉTIER RÉDIGÉ PAR L'AI BUILDER
            const systemPrompt = "Tu es l'assistant de chiffrage B2B CoopQuote AI. Reçois le besoin et retourne un JSON strict avec les clés: prestation, quantite, prix_unitaire_ht, remise_coop_pct (15% si qte > 10 sinon 0%), total_ht, tva_pct (20), total_ttc.";

            try {
                // Simulation d'un délai réseau API LLM
                setTimeout(() => {
                    const isBulk = promptInput.toLowerCase().includes('15') || promptInput.toLowerCase().includes('équipe') || promptInput.toLowerCase().includes('lot');
                    const qty = isBulk ? 15 : 1;
                    const unitPrice = 850;
                    const discount = qty >= 10 ? 0.15 : 0;
                    const totalHT = (qty * unitPrice) * (1 - discount);
                    const totalTTC = totalHT * 1.20;

                    const responseData = {
                        "statut_api": "200 OK",
                        "model": "claude-3-5-sonnet",
                        "system_prompt_utilise": systemPrompt,
                        "donnees_metier": {
                            "prestation": "Équipement Postes de Travail B2B",
                            "quantite": qty,
                            "prix_unitaire_ht": unitPrice + " €",
                            "regle_appliquee": qty >= 10 ? "RM-02 : Remise coopérative 15% appliquée (>10 unités)" : "Tarif standard",
                            "remise_coop_pct": (discount * 100) + " %",
                            "total_ht": totalHT.toFixed(2) + " €",
                            "tva": "20 % (RM-01)",
                            "total_ttc": totalTTC.toFixed(2) + " €"
                        }
                    };

                    jsonOutput.innerText = JSON.stringify(responseData, null, 2);
                    outputContainer.classList.remove('hidden');

                    statusBadge.innerText = "Réponse IA reçue (200 OK)";
                    statusBadge.className = "text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-500/30";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }, 1500);

            } catch (error) {
                statusBadge.innerText = "Erreur API";
                statusBadge.className = "text-[10px] bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-full";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
